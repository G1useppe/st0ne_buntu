# =============================================================================
# versions.conf — Pinned tool versions for reproducible builds
#
# Update these deliberately after testing. Use ./install.sh to apply.
# "latest" means the module will fetch the newest release (less reproducible).
# =============================================================================

# Elastic Stack — Arkime 5.x requires ES 8.x
elasticsearch=8.17.0
kibana=8.17.0
filebeat=8.17.0

# Arkime — check compatibility matrix at https://arkime.com/downloads
arkime=6.4.0

# Suricata — installed via OISF PPA (tracks latest stable)
# Version here is informational; the PPA controls the actual version.
suricata=ppa-stable

# Zeek — installed via OBS repository
zeek=7.0.4

# Hayabusa — GitHub release binary
hayabusa=2.18.0

# YARA — from source or apt
yara=4.5.2

# suricata-update — bundled with Suricata 7+; no separate version needed
suricata_update=bundled
